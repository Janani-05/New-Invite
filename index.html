<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>You're Invited</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Audio Permission Overlay -->
    <div id="overlay" class="overlay">
        <div class="overlay-card">
            <h2>You Are Invited! 💌</h2>
            <p>Tap below to open invitation with music</p>
            <button id="openBtn" class="open-btn">Open Invitation 🎵</button>
        </div>
    </div>

    <!-- Floating Audio Toggle Button -->
    <button id="musicBtn" class="music-btn" aria-label="Toggle Music">
        🎵 <span id="musicText">Play Music</span>
    </button>

    <!-- Background Audio -->
    <audio id="bgMusic" loop preload="auto" playsinline>
        <source src="dheema.mp3" type="audio/mpeg">
        <source src="./dheema.mp3" type="audio/mpeg">
    </audio>

    <!-- Main Content -->
    <div class="container">
        <header class="header">
            <h1>Special Invitation</h1>
            <p class="subtitle">Join us in celebrating this special occasion</p>
        </header>

        <main class="content">
            <div class="card">
                <h2>Event Details</h2>
                <p class="date">📅 Date: Coming Soon</p>
                <p class="venue">📍 Venue: Special Location</p>
                <p class="message">We look forward to celebrating with you!</p>
            </div>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
