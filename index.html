<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wedding Invitation</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Entrance Overlay to bypass browser audio blocking -->
    <div id="overlay" class="overlay">
        <div class="overlay-card">
            <h1> Wedding Invitation </h1>
            <p>Click below to open</p>
            <button id="openBtn">Open Invitation</button>
        </div>
    </div>

    <!-- Background Music -->
    <audio id="bgMusic" loop preload="auto">
        <source src="dheema.mp3" type="audio/mpeg">
        Your browser does not support the audio element.
    </audio>

    <!-- Main Content -->
    <div class="container">
        <header class="header">
            <h2>You're Invited!</h2>
            <p class="subtitle">Join us in celebrating our special day</p>
        </header>

        <main class="content">
            <p>We invite you to share in our joy as we celebrate our wedding reception.</p>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
