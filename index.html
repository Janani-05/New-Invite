<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wedding Invitation | Sheshathri &amp; Janani</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Great+Vibes&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <!-- Audio Player -->
    <audio id="bgMusic" loop preload="auto">
        <source src="music.mp3" type="audio/mpeg">
    </audio>

    <!-- Tap to Open Envelope Overlay -->
    <div id="entranceOverlay" class="entrance-overlay">
        <div class="envelope-container" id="enterBtn">
            <div class="v-flap"></div>
            
            <span class="hashtag">#SHAMA</span>
            <div class="styled-monogram">S &amp; J</div>
            <div class="names-text">M.S. Sheshathri &amp; S. Janani</div>

            <div class="tap-btn">
                <i class="fa-solid fa-envelope-open"></i> Tap to Open
            </div>
        </div>
    </div>

    <!-- Main Content -->
    <main class="main-content">
        <section class="hero-section">
            <p class="tagline">#ShaMa</p>
            <h1 class="couple-names">Sheshathri <br><span>&amp;</span><br> Janani</h1>
            <p class="wedding-date">August 2026</p>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
